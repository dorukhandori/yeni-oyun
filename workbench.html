<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Asset Workbench v2</title>
    <link rel="stylesheet" href="/src/workbench/workbench.css" />
  </head>
  <body>
    <div id="wb-app">
      <canvas id="wb-canvas"></canvas>

      <aside id="wb-panel">
        <header class="wb-header">
          <h1>Asset Workbench <span class="wb-ver">v2</span></h1>
          <p class="wb-sub">Preset seç — hepsi tek ekranda.</p>
        </header>

        <section class="wb-group">
          <label class="wb-label">Önizleme</label>
          <div class="wb-preset-grid" id="wb-preset-grid"></div>
        </section>

        <section class="wb-group">
          <label class="wb-label" for="wb-model-list">veya model listesi</label>
          <select id="wb-model-list" class="wb-input">
            <option value="">— dosya seç —</option>
          </select>
        </section>

        <section class="wb-group" id="wb-controls">
          <label class="wb-label">Kontroller</label>

          <div id="wb-scene-controls" hidden>
            <label class="wb-label" for="wb-depart">
              Ayrılış — <span id="wb-depart-val">0.00</span>
            </label>
            <input type="range" id="wb-depart" min="0" max="1" step="0.01" value="0" />
            <label class="wb-label" for="wb-day">
              Gün — <span id="wb-day-val">0.35</span>
            </label>
            <input type="range" id="wb-day" min="0" max="1" step="0.01" value="0.35" />
          </div>

          <div id="wb-clip-controls" hidden>
            <label class="wb-label">Animasyon</label>
            <div class="wb-clip-list" id="wb-clip-list"></div>
            <label class="wb-label" for="wb-anim-scrub">
              Kare — <span id="wb-anim-scrub-val">0.00</span>s /
              <span id="wb-anim-dur">0.00</span>s
            </label>
            <input type="range" id="wb-anim-scrub" min="0" max="1" step="0.001" value="0" disabled />
          </div>

          <label class="wb-label" for="wb-time-speed">
            Hız — <span id="wb-time-speed-val">1.00</span>×
          </label>
          <input type="range" id="wb-time-speed" min="0" max="2" step="0.05" value="1" />

          <div class="wb-row">
            <button type="button" class="wb-btn" id="wb-anim-toggle">Duraklat</button>
            <button type="button" class="wb-btn ghost" id="wb-anim-restart">Başa sar</button>
            <button type="button" class="wb-btn ghost danger" id="wb-clear">Temizle</button>
          </div>
        </section>

        <section class="wb-group wb-info" id="wb-info"></section>

        <footer class="wb-status" id="wb-status">Yükleniyor…</footer>

        <!-- Gelişmiş — gizli inputlar, JS bağlantısı için -->
        <input type="file" id="wb-file-input" accept=".glb,.gltf" hidden />
        <input type="text" id="wb-path-input" hidden />
        <input type="checkbox" id="wb-fit-enable" checked hidden />
        <input type="number" id="wb-fit-meters" value="1.8" hidden />
        <input type="checkbox" id="wb-pin-enable" checked hidden />
        <input type="checkbox" id="wb-anim-loop" checked hidden />
        <select id="wb-extra-clip-list" hidden></select>
        <button type="button" id="wb-extra-clip-add" hidden></button>
        <button type="button" id="wb-load-bundle" hidden></button>
        <button type="button" id="wb-load-model" hidden></button>
        <div id="wb-drop" hidden></div>
        <button type="button" id="wb-file-pick" hidden></button>
      </aside>
    </div>
    <script type="module" src="/src/workbench/main.ts"></script>
  </body>
</html>
